[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digifact-sdk"
version = "3.0.0"
description = "Python SDK for Digifact FEL Guatemala e-invoicing API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AALONZOLU", email = "noreply@github.com" }
]
keywords = ["digifact", "fel", "guatemala", "factura", "e-invoicing", "sat"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "pytest-timeout",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["digifact_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
timeout = 300

[tool.coverage.run]
source = ["digifact_sdk"]
omit = ["tests/*", "examples/*"]
