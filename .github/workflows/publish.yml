name: Publish

# Triggered by pushing a version tag: git tag v1.2.3 && git push --tags
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write  # needed for PyPI and NuGet trusted publishing

jobs:
  # ── 1. Run all unit tests before publishing ────────────────────────────────
  test:
    name: Pre-publish unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, bcmath, json
          tools: composer

      - name: Python unit tests
        run: |
          pip install -e "python/[dev]"
          cd python && python -m pytest tests/ -v -k "Unit"

      - name: PHP unit tests
        run: |
          cd php && composer install --no-interaction --prefer-dist
          ./vendor/bin/phpunit tests/ --filter "testPad|testCalc|testFmt|testDteResult"

      - name: JavaScript unit tests
        working-directory: javascript
        run: node --test --test-name-pattern="Unit" tests/integration.test.js

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0"

      - name: .NET unit tests
        working-directory: dotnet
        run: dotnet test tests/Digifact.Fel.Tests.csproj --verbosity minimal

  # ── 2. Publish Python SDK to PyPI ─────────────────────────────────────────
  publish-python:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: pypi
      url: https://pypi.org/p/digifact-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set package version from tag
        run: |
          TAG="${{ github.ref_name }}"          # e.g. v1.2.3
          VERSION="${TAG#v}"                    # strip leading 'v'
          sed -i "s/^version = .*/version = \"$VERSION\"/" python/pyproject.toml

      - name: Build distribution
        run: |
          pip install build
          python -m build python/ --outdir python/dist/

      - name: Publish to PyPI (trusted publishing — no token needed)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
        # Alternative: use API token instead of trusted publishing
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
        #   packages-dir: python/dist/

  # ── 3. Publish JavaScript SDK to npm ──────────────────────────────────────
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write  # required for npm OIDC trusted publishing (no token needed)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"              # npm 11.5.1+ ships with Node 24 — required for OIDC
          registry-url: "https://registry.npmjs.org"

      - name: Clean .npmrc for OIDC auth
        # setup-node writes always-auth=true and _authToken=${NODE_AUTH_TOKEN} which
        # interfere with the OIDC handshake. Remove them; keep only the registry line.
        run: sed -i '/always-auth\|NODE_AUTH_TOKEN/d' ~/.npmrc

      - name: Set package version from tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          cd javascript && npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm (OIDC trusted publishing — no NPM_TOKEN needed)
        working-directory: javascript
        run: npm publish --access public --provenance

  # ── 4. Publish C# SDK to NuGet ────────────────────────────────────────────
  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write  # required for NuGet trusted publishing (OIDC → temp API key)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0"

      - name: Set package version from tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          sed -i "s|<Version>.*</Version>|<Version>$VERSION</Version>|" dotnet/Digifact.Fel.csproj

      - name: Pack
        working-directory: dotnet
        run: dotnet pack Digifact.Fel.csproj --configuration Release --output nupkgs

      - name: NuGet login (trusted publishing — no API key needed)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USERNAME }}
        # Configure trusted publishing on nuget.org:
        #   nuget.org → Trusted Publishing → Add publisher:
        #     Repository Owner: aalonzolu
        #     Repository:       digifact
        #     Workflow file:    publish.yml
        #     Environment:      (leave blank)
        # Required secret:
        #   NUGET_USERNAME — your nuget.org username (not email)

      - name: Publish to NuGet
        working-directory: dotnet
        run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  # ── 5. Notify Packagist to update PHP SDK ─────────────────────────────────
  publish-packagist:
    name: Notify Packagist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Trigger Packagist webhook
        run: |
          curl -sS -X POST \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}'
        # Packagist auto-detects new tags and updates when notified.
        # Required secrets:
        #   PACKAGIST_USERNAME  — your packagist.org username
        #   PACKAGIST_API_TOKEN — API token from packagist.org/profile
